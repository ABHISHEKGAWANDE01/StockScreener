[theme]
base = "dark"
primaryColor = "#E11D48"
backgroundColor = "#07010F"
secondaryBackgroundColor = "#160824"
textColor = "#F8FAFC"
linkColor = "#FDA4AF"
borderColor = "#FB7185"
codeBackgroundColor = "#1A0B2E"
codeTextColor = "#F8FAFC"
dataframeBorderColor = "#FB7185"
dataframeHeaderBackgroundColor = "#1A0B2E"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "999px"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["2rem", "1.45rem", "1.2rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [800, 700, 700, 600, 600, 500]
linkUnderline = false
font = "Syne:https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
greenColor = "#86EFAC"
redColor = "#FB7185"
orangeColor = "#FCD34D"
blueColor = "#FDA4AF"
violetColor = "#FB7185"
grayColor = "#E2E8F0"
chartCategoricalColors = ["#E11D48", "#FB7185", "#FDA4AF", "#F8FAFC", "#86EFAC", "#FCD34D", "#F472B6"]

